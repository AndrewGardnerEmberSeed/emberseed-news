name: Nightly AI news

on:
  schedule:
    # GitHub runs on UTC. 14:30 UTC is 1am in Adelaide during daylight saving
    # (UTC+10:30); 15:30 UTC is 1am the rest of the year (UTC+9:30).
    # GitHub often starts scheduled runs late (by hours on a busy night) or
    # skips them, so this tries every hour until 22:30 UTC. build.py only makes
    # an edition from 1am to 10am in Adelaide, and only one a day.
    - cron: "30 14-22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = make a new edition now (replaces today's); render = rebuild the pages from data/ after fixing a story; test = a full run with Claude that publishes nothing"
        type: choice
        options: [build, render, test]
        default: build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      NEWS_SITE_URL: ${{ vars.NEWS_SITE_URL }}
      NEWS_MODEL: ${{ vars.NEWS_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the latest commit, even if this run waited behind another

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tonight's edition
        if: github.event_name == 'schedule' && env.HAS_KEY == 'true'
        run: python3 build.py

      - name: Skip (no API key yet)
        if: github.event_name == 'schedule' && env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY isn't set yet, so there's no new edition tonight."

      - name: New edition now
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        run: python3 build.py --force

      - name: Rebuild pages from data
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'render'
        run: python3 build.py --render-only

      - name: Test run (publishes nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python3 build.py --dry-run

      # Publish when there's a new edition, or when a build or render was run by
      # hand. The quiet hourly runs leave the site alone.
      - name: Save the edition
        id: save
        if: inputs.mode != 'test'
        run: |
          git config user.name "EmberSeed News"
          git config user.email "news-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "AI news $(TZ=Australia/Adelaide date +%Y-%m-%d)"
            git push
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
