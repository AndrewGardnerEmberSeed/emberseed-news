name: Publish AI news

# Since 4 November 2026 Andrew's Mac makes the edition overnight (mac_job.py, on his Max plan, through Claude Code) and
# pushes data/ and site/. This only publishes what it pushes. On 5 November Andrew had the API taken out altogether
# ("please do 2": switch off the API completely), so GitHub no longer makes an edition itself and holds no Claude key:
# if the Mac misses a night, there's no edition until it runs (it tries every hour from 1am to 9am).
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "render = rebuild the pages from data/ after fixing a story (to make a new edition, run python3 mac_job.py on the Mac)"
        type: choice
        options: [render]
        default: render

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    env:
      NEWS_SITE_URL: ${{ vars.NEWS_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the latest commit, even if this run waited behind another

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild pages from data
        if: github.event_name == 'workflow_dispatch'
        run: python3 build.py --render-only

      - name: Save the pages
        id: save
        run: |
          git config user.name "EmberSeed News"
          git config user.email "news-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "AI news pages $(TZ=Australia/Adelaide date +%Y-%m-%d)"
            git push
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
