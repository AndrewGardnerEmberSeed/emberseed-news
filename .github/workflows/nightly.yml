name: Nightly AI news

on:
  # Since 4 November 2026 Andrew's Mac makes the edition overnight (mac_job.py, on his Max plan) and pushes it;
  # this publishes what it pushes.
  push:
    branches: [main]
    paths: ["site/**"]
  schedule:
    # The fallback, while the Mac proves itself: if there's no edition by about 6am, make one here with the API
    # (ANTHROPIC_API_KEY). GitHub runs on UTC: 19:30 UTC is 6am in Adelaide during daylight saving (UTC+10:30),
    # 5am the rest of the year. build.py makes nothing if today's edition is already there. To end the fallback,
    # delete this schedule and the ANTHROPIC_API_KEY secret.
    - cron: "30 19-22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = make a new edition now (replaces today's); render = rebuild the pages from data/ after fixing a story; test = a full run with Claude that publishes nothing"
        type: choice
        options: [build, render, test]
        default: build
      pick_model:
        description: "Optional, this run only: the model that picks the stories"
        type: string
        required: false
      write_model:
        description: "Optional, this run only: the model that writes the stories"
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      NEWS_SITE_URL: ${{ vars.NEWS_SITE_URL }}
      NEWS_PICK_MODEL: ${{ inputs.pick_model || vars.NEWS_PICK_MODEL }}
      NEWS_WRITE_MODEL: ${{ inputs.write_model || vars.NEWS_WRITE_MODEL }}
      NEWS_EFFORT: ${{ vars.NEWS_EFFORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the latest commit, even if this run waited behind another

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tonight's edition
        if: github.event_name == 'schedule' && env.HAS_KEY == 'true'
        run: python3 build.py

      - name: Skip (no API key yet)
        if: github.event_name == 'schedule' && env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY isn't set yet, so there's no new edition tonight."

      - name: New edition now
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        run: python3 build.py --force

      - name: Rebuild pages from data
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'render'
        run: python3 build.py --render-only

      - name: Test run (publishes nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python3 build.py --dry-run

      # Publish when there's a new edition, or when a build or render was run by
      # hand. The quiet hourly runs leave the site alone.
      - name: Save the edition
        id: save
        if: inputs.mode != 'test'
        run: |
          git config user.name "EmberSeed News"
          git config user.email "news-bot@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "AI news $(TZ=Australia/Adelaide date +%Y-%m-%d)"
            git push
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
